exclude_docs: |
  01-ecosystem-and-installation/09-demo-project/counter/
  01-ecosystem-and-installation/09-demo-project/internal/
  01-ecosystem-and-installation/09-demo-project/go.mod
  01-ecosystem-and-installation/09-demo-project/main.go

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

